<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis tareas</title>
    <link rel="stylesheet" href="kit.css">
</head>
<body>
    <main class="app-tareas tarjeta">
        <header class="app-tareas-encabezado">
            <h1>✅ Mis tareas</h1>
            <button type="button" class="boton boton-secundario" aria-label="Cambiar tema">🌙</button>
        </header>

        <form class="app-tareas-form">
            <label for="nuevaTarea" class="oculto-visual">Nueva tarea</label>
            <input type="text" id="nuevaTarea" placeholder="Escribe una tarea...">
            <button type="submit" class="boton">Agregar</button>
        </form>
        <p class="alerta alerta-error oculto" role="alert">⚠️ Escribe algo antes de agregar.</p>

        <ul class="lista-tareas">
            <li class="tarea">
                <span>Llegar a estudiar</span>
                <button type="button" class="boton boton-peligro" aria-label="Eliminar tarea: Llegar a estudiar">🗑️</button>
            </li>
            <li class="tarea hecha">
                <span>Subir el reto</span>
                <button type="button" class="boton boton-peligro" aria-label="Eliminar tarea: Subir el reto">🗑️</button>
            </li>
            <li class="tarea">
                <span>Repasar los estilos CSS</span>
                <button type="button" class="boton boton-peligro" aria-label="Eliminar tarea: Repasar los estilos CSS">🗑️</button>
            </li>
        </ul>

        <p class="contador">2 pendientes de 3</p>
    </main>
</body>
</html>

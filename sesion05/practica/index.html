<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Registro De La Biblioteca 📘.</h1>
      <form action="#" class="formulario">
        <fieldset>
          <legend>Datos Personales 👤.</legend>
          <div class="campo">
            <label for="nombre">Nombre Completo: </label>
            <input type="text" id="nombre" main="nombre" required />
          </div>
          <div class="campo">
            <label for="documento">Documento de Identidad: </label>
            <input type="text" id="documento" main="documento" required/>
          </div>
          <div class="campo">
            <label for="correo">Correo Electronico: </label>
            <input type="email" id="correo" main="correo" required/>
          </div>
          <div class="campo">
            <label for="nacimiento">Fecha de Nacimiento: </label>
            <input
              type="date"
              id="nacimiento"
              main="nacimiento"
              min="1900-01-01"
              max="2026-10-21"
            />
          </div>
          <div class="campo">
            <label for="clave">Contraseña: </label>
            <input type="password" id="clave" main="clave" required minlength="8"/>
          </div>
          <div class="campo">
            <label for="nacimiento">Edad: </label>
            <input type="number" id="edad" main="edad" min="0" max="120" />
          </div>
        </fieldset>
        <fieldset>
          <legend>Tú Perfil</legend>
          <div class="campo">
            <label for="tipo">Tipo de Usuario</label>
            <select name="tipo" id="tipo" required>
              <option value="">Elige una opción</option>
              <option value="aprendiz">Aprediz</option>
              <option value="instructor">Instructor</option>
              <option value="visitante">Visitante</option>
            </select>
          </div>
          <fieldset class="grupo">
            <legend>Sede</legend>
            <label for="norte">
              <input type="radio" name="sede" id="norte" value="norte" checked />Norte
            </label>
            <label for="norte">
              <input type="radio"name="sede"id="centro"value="centro"/>Centro
            </label>
            <label for="norte">
              <input type="radio" name="sede" id="sur" value="sur" />Sur
            </label>
          </fieldset>

          <fieldset class="grupo">
            <legend>Temas que te interesan.</legend>
            <label for="novelas" class="opcion">
                <input type="checkbox" name="temas" id="novelas" value="novelas">Novelas
            </label>
            <label for="ciencia" class="opcion">
                <input type="checkbox" name="temas" id="ciencia" value="ciencia">Ciencia
            </label>
            <label for="tecnologia" class="opcion">
                <input type="checkbox" name="temas" id="tecnologia" value="tecnologia">Tecnología
            </label>
          </fieldset>
          <div class="campo">
            <label for="comentario">Qué libro te gustaría que tuvieramos?</label>
            <textarea name="comentario" id="comentario" rows="4"></textarea>
          </div>
        </fieldset>
        <button type="submit" class="boton">Registrarme</button>
      </form>
    </main>
  </body>
</html>
